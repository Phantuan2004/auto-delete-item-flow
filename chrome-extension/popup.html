<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Flow Veo 3 Cleaner</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #202124;
      color: #e8eaed;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .icon {
      font-size: 22px;
    }
    .title {
      font-weight: 600;
      font-size: 14px;
      color: #8ab4f8;
    }
    .desc {
      color: #9aa0a6;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      background: #8ab4f8;
      color: #202124;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      box-sizing: border-box;
      margin-bottom: 8px;
    }
    .btn:hover {
      background: #aecbfa;
    }
    .status-box {
      background: #282a2d;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      color: #81c995;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="icon">⚡</span>
    <span class="title">Flow Veo 3 Cleaner</span>
  </div>
  <div class="desc">
    Tiện ích tự động xóa hàng loạt video và ảnh trong dự án đang mở trên Google Flow.
  </div>
  <a href="https://flow.google.com/" target="_blank" class="btn">Mở Google Flow</a>
  <div class="status-box">
    💡 Khi mở một dự án trong flow.google.com, widget điều khiển sẽ tự động hiển thị ở góc dưới bên phải màn hình.
  </div>
</body>
</html>
